# Mapping canal_slug → domínio do vault Obsidian.
#
# Copie este arquivo pra `channel_domains.yaml` (não versionado) e edite
# com os canais reais que você consome.
#
# Resolução em cascata (ver src/yt_nota/domain.py):
#   1. Flag --dominio (override explícito na CLI)
#   2. Frontmatter `dominio:` do draft (se já preenchido)
#   3. Lookup neste arquivo pelo canal_slug
#   4. Se nada bater, CLI aborta pedindo --dominio ou inclusão aqui.
#
# Domínios válidos vêm da sua taxonomia em config/domains.yaml
# (veja config/domains.example.yaml pros valores genéricos de exemplo).

# Exemplos genéricos por domínio (placeholders — troque pelos seus canais reais
# no channel_domains.yaml, que não é versionado):

# Technology
Example-Tech-Channel: Technology
Another-Tech-Channel: Technology

# Productivity
Example-Productivity-Channel: Productivity

# Adicione seus canais conforme processa o primeiro vídeo de cada um.
# Se rodar `yt-nota <url>` e o canal não estiver mapeado, a CLI imprime
# o canal_slug exato pra você adicionar aqui.
